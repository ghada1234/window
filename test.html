<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Test - Is Site Working?</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            text-align: center;
        }
        .card {
            background: white;
            color: #333;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .success {
            background: #10b981;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:active {
            background: #4f46e5;
        }
        .info {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 6px;
            margin: 5px 0;
            font-size: 14px;
        }
        .timestamp {
            text-align: center;
            font-size: 12px;
            margin-top: 20px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Site is Working!</h1>
        
        <div class="card">
            <div class="success">
                🎉 If you can see this page, the site is deployed and working!
            </div>
        </div>

        <div class="card">
            <h3>📱 Your Device Info:</h3>
            <div class="info">Browser: <span id="browser"></span></div>
            <div class="info">Screen: <span id="screen"></span></div>
            <div class="info">Time: <span id="time"></span></div>
            <div class="info">Online: <span id="online"></span></div>
        </div>

        <div class="card">
            <h3>🔗 Quick Actions:</h3>
            <button onclick="window.location.href='/'">Go to Main App</button>
            <button onclick="window.location.href='/mobile-test.html'">Full Diagnostics</button>
            <button onclick="location.reload(true)">Force Refresh Page</button>
        </div>

        <div class="timestamp">
            Last updated: <span id="deploy-time"></span>
        </div>
    </div>

    <script>
        // Display device info
        document.getElementById('browser').textContent = 
            /Safari/.test(navigator.userAgent) ? 'Safari' :
            /Chrome/.test(navigator.userAgent) ? 'Chrome' :
            /Firefox/.test(navigator.userAgent) ? 'Firefox' : 'Unknown';
        
        document.getElementById('screen').textContent = 
            window.innerWidth + ' x ' + window.innerHeight;
        
        document.getElementById('time').textContent = 
            new Date().toLocaleTimeString();
        
        document.getElementById('online').textContent = 
            navigator.onLine ? '✅ Yes' : '❌ No';
        
        document.getElementById('deploy-time').textContent = 
            new Date().toLocaleString();

        // Log to console
        console.log('✅ Test page loaded successfully');
        console.log('Device:', navigator.userAgent);
        console.log('Online:', navigator.onLine);
    </script>
</body>
</html>
