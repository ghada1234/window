<!DOCTYPE html>
<html>
<head>
    <title>PWA Icon Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        canvas {
            border: 1px solid #ddd;
            margin: 20px 0;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            opacity: 0.9;
        }
        .info {
            background: #f0f9ff;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>🧘‍♀️ PWA Icon Generator</h1>
    <p>This will generate placeholder icons for your PWA</p>
    
    <div class="info">
        <p><strong>Note:</strong> These are placeholder icons. For production, replace with your actual logo/icon.</p>
        <p>The icons will be saved in the public folder.</p>
    </div>

    <canvas id="canvas"></canvas>
    <br>
    <button onclick="generateIcons()">Generate All Icons</button>

    <script>
        function generateIcons() {
            const sizes = [64, 192, 512];
            sizes.forEach(size => generateIcon(size));
            
            // Generate maskable icon
            generateMaskableIcon(512);
            
            alert('Icons generated! Check your Downloads folder and move them to the public folder.');
        }

        function generateIcon(size) {
            const canvas = document.getElementById('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            // Draw emoji/symbol
            ctx.fillStyle = 'white';
            ctx.font = `${size * 0.5}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🧘‍♀️', size / 2, size / 2);

            // Download
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `pwa-${size}x${size}.png`;
                a.click();
            });
        }

        function generateMaskableIcon(size) {
            const canvas = document.getElementById('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Safe zone for maskable icons (80% of size)
            const safeZone = size * 0.8;
            const padding = (size - safeZone) / 2;

            // Gradient background (full bleed)
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            // Draw emoji/symbol in safe zone
            ctx.fillStyle = 'white';
            ctx.font = `${safeZone * 0.5}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🧘‍♀️', size / 2, size / 2);

            // Download
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'maskable-icon-512x512.png';
                a.click();
            });
        }

        // Generate on load for preview
        window.onload = () => {
            const canvas = document.getElementById('canvas');
            canvas.width = 192;
            canvas.height = 192;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createLinearGradient(0, 0, 192, 192);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 192, 192);

            ctx.fillStyle = 'white';
            ctx.font = '96px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🧘‍♀️', 96, 96);
        };
    </script>
</body>
</html>
