<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Test - Find Your Inner Peace</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            background: #f5f5f5;
        }
        .test-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        .icon {
            width: 24px;
            height: 24px;
        }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>🔍 Mobile Web Test</h1>
    
    <div class="test-card">
        <h2>Device Information</h2>
        <div id="device-info"></div>
    </div>

    <div class="test-card">
        <h2>Connection Status</h2>
        <div id="connection-status"></div>
    </div>

    <div class="test-card">
        <h2>JavaScript Test</h2>
        <div class="status success">✅ JavaScript is working!</div>
    </div>

    <div class="test-card">
        <h2>Navigation Test</h2>
        <button onclick="goToApp()">Go to Main App</button>
    </div>

    <script>
        // Display device info
        const deviceInfo = document.getElementById('device-info');
        deviceInfo.innerHTML = `
            <div class="status">📱 User Agent: ${navigator.userAgent}</div>
            <div class="status">🌐 Screen: ${window.innerWidth} x ${window.innerHeight}</div>
            <div class="status">🔌 Online: ${navigator.onLine ? 'Yes ✅' : 'No ❌'}</div>
            <div class="status">🌍 Location: ${window.location.href}</div>
        `;

        // Check connection
        const connectionStatus = document.getElementById('connection-status');
        if (navigator.onLine) {
            connectionStatus.innerHTML = '<div class="status success">✅ Connected to Internet</div>';
        } else {
            connectionStatus.innerHTML = '<div class="status error">❌ No Internet Connection</div>';
        }

        // Test navigation
        function goToApp() {
            console.log('Navigating to main app...');
            window.location.href = '/';
        }

        // Log to console
        console.log('🔍 Mobile Test Page Loaded');
        console.log('📱 Device:', navigator.userAgent);
        console.log('🌐 Screen:', window.innerWidth, 'x', window.innerHeight);
        console.log('🔌 Online:', navigator.onLine);
    </script>
</body>
</html>
