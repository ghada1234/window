<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="no" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Find Your Inner Peace</title>
    
    <!-- Meta Tags -->
    <meta name="description" content="Your comprehensive wellness platform for meditation, nutrition tracking, sleep analysis, and AI-powered health insights" />
    <meta name="theme-color" content="#6366f1" />
    
    <!-- Prevent iOS from treating as app when not installed -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Unregister any problematic service workers first -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            // Only unregister if it's causing issues
            if (registration.active && registration.active.scriptURL.includes('sw.js')) {
              console.log('Cleaning up old service worker:', registration.active.scriptURL);
              registration.unregister();
            }
          }
        }).catch(function(err) {
          console.log('Service worker cleanup skipped:', err);
        });
      }
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
