<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="no" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Find Your Inner Peace</title>
    
    <!-- Meta Tags -->
    <meta name="description" content="Your comprehensive wellness platform for meditation, nutrition tracking, sleep analysis, and AI-powered health insights" />
    <meta name="theme-color" content="#6366f1" />
    
    <!-- Prevent iOS from treating as app when not installed -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root">
      <!-- Loading indicator while app loads -->
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; text-align: center; padding: 20px;">
        <div style="width: 60px; height: 60px; border: 6px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <h2 style="margin-top: 20px; font-size: 24px;">Loading App...</h2>
        <p style="margin-top: 10px; opacity: 0.8;">Please wait a moment</p>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    
    <!-- Unregister any problematic service workers first -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            // Only unregister if it's causing issues
            if (registration.active && registration.active.scriptURL.includes('sw.js')) {
              console.log('Cleaning up old service worker:', registration.active.scriptURL);
              registration.unregister();
            }
          }
        }).catch(function(err) {
          console.log('Service worker cleanup skipped:', err);
        });
      }
    </script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
